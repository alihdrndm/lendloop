name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck (Next.js + Convex)
        run: pnpm typecheck
      - name: Tests (RBAC, loan rules, HMAC, n8n endpoints)
        run: pnpm test
      - name: Workflow JSON is up to date with n8n/build-workflows.py
        run: |
          python3 n8n/build-workflows.py
          git diff --exit-code n8n/workflows
